<style>
  :root {
    --bg: #0c0e12;
    --bg2: #141820;
    --card: #1a1f2a;
    --card-hover: #222836;
    --border: #2a3140;
    --accent: #3dff9a;
    --accent-dim: rgba(61, 255, 154, 0.15);
    --accent2: #5b8cff;
    --accent2-dim: rgba(91, 140, 255, 0.15);
    --warn: #ffb84d;
    --warn-dim: rgba(255, 184, 77, 0.12);
    --danger: #ff6b7a;
    --danger-dim: rgba(255, 107, 122, 0.12);
    --muted: #8b95a8;
    --text: #e8ecf4;
    --text-dim: #a0aabd;
    --radius: 14px;
    --shadow: 0 4px 24px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
    padding: 1.25rem 1rem 3rem;
  }

  .wrap { max-width: 920px; margin: 0 auto; }

  header {
    background: linear-gradient(135deg, #1a2332 0%, #12161f 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem 1.4rem;
    margin-bottom: 1.25rem;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: "";
    position: absolute;
    top: -40%;
    right: -10%;
    width: 280px;
    height: 280px;
    background: radial-gradient(circle, rgba(61,255,154,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.75rem;
    flex-wrap: wrap;
    position: relative;
  }
  header h1 {
    font-size: 1.55rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 0.35rem;
  }
  header h1 span { color: var(--accent); }
  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem 1.2rem;
    margin-top: 0.85rem;
    font-size: 0.9rem;
    color: var(--text-dim);
    position: relative;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.3rem 0.75rem;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    border: 1px solid transparent;
  }
  .pill .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: currentColor;
  }
  .pill.healthy {
    background: var(--accent-dim);
    color: var(--accent);
    border-color: rgba(61,255,154,0.35);
  }
  .pill.warn {
    background: var(--warn-dim);
    color: var(--warn);
    border-color: rgba(255,184,77,0.4);
  }

  .grid {
    display: grid;
    gap: 1rem;
    grid-template-columns: 1fr;
  }
  @media (min-width: 680px) {
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }
    .span-2 { grid-column: 1 / -1; }
  }
  @media (min-width: 680px) and (max-width: 820px) {
    .grid-4 { grid-template-columns: 1fr 1fr; }
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.2rem 1.15rem;
    box-shadow: var(--shadow);
  }
  .card h2 {
    font-size: 0.95rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 0.9rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .card h2 .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
  }

  .metric-big {
    font-size: 2.4rem;
    font-weight: 800;
    color: var(--accent);
    line-height: 1.1;
    letter-spacing: -0.03em;
  }
  .metric-big.muted { color: var(--muted); font-size: 1.8rem; }
  .metric-unit {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--muted);
    margin-left: 0.15rem;
  }
  .metric-sub { color: var(--muted); font-size: 0.8rem; margin-top: 0.25rem; }
  .metric-label {
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 0.35rem;
  }

  .metric-tile {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 0.95rem;
  }

  .wifi-row {
    display: grid;
    gap: 0.55rem;
  }
  .wifi-band {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem 0.9rem;
  }
  .wifi-band .left { display: flex; flex-direction: column; gap: 0.15rem; }
  .wifi-band .band-name { font-weight: 700; font-size: 0.95rem; }
  .wifi-band .band-meta { font-size: 0.8rem; color: var(--muted); }
  .wifi-band .vals {
    text-align: right;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--accent);
  }
  .wifi-band .vals small {
    display: block;
    font-weight: 500;
    font-size: 0.75rem;
    color: var(--muted);
  }

  .sec-badge {
    display: inline-block;
    margin-top: 0.75rem;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--accent2);
    background: var(--accent2-dim);
    border: 1px solid rgba(91,140,255,0.35);
    padding: 0.2rem 0.55rem;
    border-radius: 6px;
  }

  .hist-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    margin: 0 -0.15rem;
    padding-bottom: 0.15rem;
  }
  table.hist {
    width: 100%;
    min-width: 700px;
    border-collapse: collapse;
    font-size: 0.88rem;
  }
  table.hist th {
    text-align: left;
    color: var(--muted);
    font-weight: 600;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 0.45rem 0.45rem;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  table.hist td {
    padding: 0.6rem 0.45rem;
    border-bottom: 1px solid rgba(42,49,64,0.5);
    vertical-align: middle;
    white-space: nowrap;
  }
  table.hist td.notes { white-space: normal; }
  table.hist tr:last-child td { border-bottom: none; }
  table.hist tr:hover td { background: rgba(34,40,54,0.45); }
  .spark {
    display: inline-flex;
    align-items: flex-end;
    gap: 2px;
    height: 22px;
    vertical-align: middle;
  }
  .spark span {
    width: 5px;
    border-radius: 2px 2px 0 0;
    background: var(--accent);
    opacity: 0.85;
    min-height: 3px;
  }
  .spark span.nil {
    background: transparent;
    border: 1px dashed var(--border);
    border-bottom: none;
    opacity: 1;
  }

  /* Tukiasemat */
  .ap-list { display: grid; gap: 0.55rem; }
  @media (min-width: 680px) { .ap-list { grid-template-columns: 1fr 1fr; } }
  .ap-item {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem 0.9rem;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    min-width: 0;
  }
  .ap-item .ap-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.6rem;
  }
  .ap-item .ap-name { font-weight: 700; font-size: 0.95rem; }
  .ap-item .ap-role { font-size: 0.78rem; color: var(--muted); }
  .ap-item .ap-ch { font-weight: 700; color: var(--accent); font-size: 0.9rem; }
  .ap-item .ap-meta { font-size: 0.8rem; color: var(--text-dim); line-height: 1.4; overflow-wrap: anywhere; }
  .ap-item .ap-ping { font-size: 0.82rem; color: var(--muted); }
  .ap-item .ap-ping strong { color: var(--text); }
  .pill.small { font-size: 0.72rem; padding: 0.2rem 0.55rem; white-space: nowrap; }
  .pill.unknown {
    background: rgba(139,149,168,0.12);
    color: var(--muted);
    border-color: rgba(139,149,168,0.35);
  }
  .notes { color: var(--text-dim); font-size: 0.82rem; max-width: 220px; }
  .nullish { color: var(--muted); }

  /* Mobile: card-per-check (gym session-style tiles) */
  .hist-cards {
    display: none;
    gap: 0.55rem;
  }
  .hist-check {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem 0.9rem;
  }
  .hist-check .hc-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.6rem;
    margin-bottom: 0.55rem;
  }
  .hist-check .hc-date {
    font-weight: 700;
    font-size: 0.95rem;
  }
  .hist-check .hc-period {
    display: block;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--muted);
    margin-top: 0.1rem;
  }
  .hist-check .hc-metrics {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.4rem 0.65rem;
  }
  .hist-check .hc-metric {
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
    background: rgba(12,14,18,0.35);
    border-radius: 8px;
    padding: 0.45rem 0.55rem;
  }
  .hist-check .hc-metric .k {
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .hist-check .hc-metric .v {
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--accent);
  }
  .hist-check .hc-notes {
    margin-top: 0.55rem;
    padding-top: 0.5rem;
    border-top: 1px solid rgba(42,49,64,0.55);
    font-size: 0.82rem;
    color: var(--text-dim);
    line-height: 1.4;
  }
  .hist-check .hc-spark {
    margin-top: 0.5rem;
  }

  @media (max-width: 679px) {
    .hist-scroll { display: none; }
    .hist-cards { display: grid; }
    .card { padding: 1rem 0.9rem; }
  }


  /* Time series */
  #charts {
    position: relative;
    display: grid;
    gap: 1.05rem;
  }
  .chart-block { min-width: 0; }
  .chart-block h3 {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--text-dim);
    margin-bottom: 0.35rem;
    letter-spacing: 0.01em;
  }
  .chart-svg-host { width: 100%; }
  .chart-svg {
    display: block;
    width: 100%;
    height: auto;
    touch-action: pan-y;
  }
  .chart-svg .grid { stroke: rgba(42, 49, 64, 0.95); stroke-width: 1; }
  .chart-svg .tick,
  .chart-svg .xlab,
  .chart-svg .unit {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .chart-svg .tick { fill: var(--muted); font-size: 12px; }
  .chart-svg .tick-l { text-anchor: end; }
  .chart-svg .tick-r { text-anchor: start; fill: #5ce1ff; }
  .chart-svg .xlab { fill: var(--text-dim); font-size: 12px; }
  .chart-svg .xper { fill: var(--muted); font-size: 11px; }
  .chart-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem 0.85rem;
    margin-top: 0.4rem;
  }
  .chart-legend .leg {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.8rem;
    color: var(--text-dim);
    font-weight: 600;
  }
  .chart-legend .sw {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
  .chart-note {
    font-size: 0.75rem;
    color: var(--muted);
  }
  .chart-tip {
    position: absolute;
    z-index: 5;
    pointer-events: none;
    background: #12161f;
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 0.78rem;
    font-weight: 600;
    line-height: 1.35;
    padding: 0.35rem 0.55rem;
    border-radius: 8px;
    box-shadow: var(--shadow);
    white-space: pre;
    max-width: calc(100% - 8px);
  }
  @media (min-width: 800px) {
    #charts { grid-template-columns: 1fr 1fr; align-items: start; }
    .chart-block.wide, .chart-note { grid-column: 1 / -1; }
  }

  footer {
    margin-top: 1.5rem;
    text-align: center;
    font-size: 0.78rem;
    color: var(--muted);
  }
</style>
</head>

  function niceScale(min, max, tickTarget) {
    if (!(max > min)) {
      const pad = Math.abs(min) > 0 ? Math.abs(min) * 0.25 : 1;
      min -= pad;
      max += pad;
    }
    const rough = (max - min) / Math.max(1, tickTarget - 1);
    const pow = Math.pow(10, Math.floor(Math.log10(rough)));
    const n = rough / pow;
    const mult = n <= 1.5 ? 1 : n <= 3 ? 2 : n <= 7 ? 5 : 10;
    const step = mult * pow;
    let niceMin = Math.floor(min / step) * step;
    let niceMax = Math.ceil(max / step) * step;
    if (niceMax === niceMin) niceMax = niceMin + step;
    const ticks = [];
    const count = Math.round((niceMax - niceMin) / step);
    for (let i = 0; i <= count; i++) {
      ticks.push(Math.round((niceMin + i * step) * 1000) / 1000);
    }
    return { min: ticks[0], max: ticks[ticks.length - 1], step, ticks };
  }

  }

  function renderChart(spec, width) {
    const n = hist.length;
    const dual = spec.series.some(s => s.axis === 'r');
    const narrow = width < 420;
    const padL = narrow ? 36 : 42;
    const padR = dual ? (narrow ? 40 : 46) : 14;
    const plotW = Math.max(24, width - padL - padR);
    const labelW = 48;
    const labelStep = Math.max(1, Math.ceil((n * labelW) / Math.max(plotW, 1)));
    const showIdx = [];
    for (let i = 0; i < n; i += labelStep) showIdx.push(i);
    if (n && showIdx[showIdx.length - 1] !== n - 1) {
      if ((n - 1) - showIdx[showIdx.length - 1] < labelStep * 0.65) showIdx.pop();

    }
    const padT = 14;
    const padB = 42;
    const h = narrow ? 220 : 208;
    const plotH = h - padT - padB;

    function collect(axis) {
      const vals = [];
      spec.series.filter(s => s.axis === axis).forEach(s => {

    }

    function scaleFor(vals, zero) {

      let hi = vals.length ? Math.max(...vals) : 1;
      if (zero) lo = Math.min(0, lo);

    }

    const rScale = dual ? scaleFor(collect('r'), false) : null;

    const xAt = (i) => n <= 1 ? padL + plotW / 2 : padL + (i / (n - 1)) * plotW;
    const yAt = (v, scale) => {

    const parts = [];

    const labelHalf = 26;
    showIdx.forEach(i => {

      parts.push(`<text class="xlab" text-anchor="middle"><tspan x="${lx.toFixed(1)}" y="${y1}">${date}</tspan><tspan x="${lx.toFixed(1)}" y="${y2}" class="xper">${per}</tspan></text>`);
    });

    hist.forEach((row, i) => {
      const x = xAt(i);
      const half = Math.min(22, slot / 2);
      const tip = escapeHtml(chartTipText(spec, i)).replace(/\n/g, '&#10;');
      parts.push(`<rect class="hit" x="${(x - half).toFixed(1)}" y="${padT}" width="${(half * 2).toFixed(1)}" height="${plotH.toFixed(1)}" fill="transparent" data-tip="${tip}"/>`);
    });

    parts.push('</svg>');
    return parts.join('');
  }

  function paintCharts() {
    CHARTS.forEach((spec, i) => {
      const host = document.getElementById('chartHost' + i);
      if (!host) return;
      const w = Math.max(Math.floor(host.clientWidth) || 0, 260);
      host.innerHTML = renderChart(spec, w);
    });
  }

  function initCharts() {
    const root = document.getElementById('charts');
    if (!root) return;
    const tip = document.createElement('div');
    tip.id = 'chartTip';
    tip.className = 'chart-tip';
    tip.hidden = true;
    root.appendChild(tip);
    CHARTS.forEach((c, i) => {
      const block = document.createElement('div');
      block.className = 'chart-block' + (c.wide ? ' wide' : '');
      const h3 = document.createElement('h3');
      h3.textContent = c.title;
      const host = document.createElement('div');
      host.className = 'chart-svg-host';
      host.id = 'chartHost' + i;
      const legend = document.createElement('div');
      legend.className = 'chart-legend';
      legend.innerHTML = c.series.map(s =>
        `<span class="leg"><i class="sw" style="background:${s.color}"></i>${escapeHtml(s.label)}</span>`
      ).join('');
      block.appendChild(h3);
      block.appendChild(host);
      block.appendChild(legend);
      root.appendChild(block);
    });
    const note = document.createElement('p');
    note.className = 'chart-note';
    note.textContent = 'Aukko viivassa = ei mittausta (null/puuttuu ei piirry nollana). Yksittäinen piste = vain yksi mittaus.';
    root.appendChild(note);

    const placeTip = (clientX, clientY) => {
      const r = root.getBoundingClientRect();
      const tw = tip.offsetWidth || 140;
      const th = tip.offsetHeight || 48;
      let x = clientX - r.left + 12;
      let y = clientY - r.top - th - 10;
      if (x + tw > r.width - 4) x = r.width - tw - 4;
      if (x < 4) x = 4;
      if (y < 4) y = clientY - r.top + 14;
      tip.style.left = x + 'px';
      tip.style.top = y + 'px';
    };
    const showFrom = (el, ev) => {
      const hit = el && el.closest ? el.closest('.hit') : null;
      if (!hit || !root.contains(hit)) {
        tip.hidden = true;
        return;
      }
      tip.hidden = false;
      tip.textContent = hit.getAttribute('data-tip') || '';
      if (ev && ev.clientX != null) placeTip(ev.clientX, ev.clientY);
    };
    root.addEventListener('pointerover', (e) => showFrom(e.target, e));
    root.addEventListener('pointermove', (e) => { if (!tip.hidden) showFrom(e.target, e); });
    root.addEventListener('pointerdown', (e) => showFrom(e.target, e));
    root.addEventListener('pointerout', (e) => {
      if (e.target.closest && e.target.closest('.hit')) tip.hidden = true;
    });
    root.addEventListener('pointerleave', () => { tip.hidden = true; });
    window.addEventListener('resize', paintCharts);
    paintCharts();
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  initCharts();
})();
</script>
</body>
</html>
